<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d7edcf"><title>나의 동숲 기록장 v3</title><style>
:root{--ink:#40574b;--green:#6e9b78;--paper:#fffdf4;--line:#e4dfce}*{box-sizing:border-box}body{margin:0;background:#e9f0df;color:var(--ink);font-family:system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif}header{max-width:780px;margin:18px auto 0;padding:26px 24px 20px 48px;background:#f7dcae;border:2px solid #d7b98c;border-bottom:0;border-radius:22px 22px 0 0;position:relative}header:before,main:before{content:'';position:absolute;left:17px;top:0;bottom:0;border-left:2px dashed #d9b6a7}header h1{margin:0;font-size:26px}small{color:#786f5e}main{max-width:780px;margin:0 auto 20px;padding:12px 18px 35px 45px;background:repeating-linear-gradient(to bottom,var(--paper) 0,var(--paper) 33px,#e8e6d8 34px);border:2px solid #d7b98c;border-top:0;border-radius:0 0 22px 22px;position:relative;min-height:75vh;box-shadow:8px 10px 0 #b8cdb4}nav{display:flex;gap:7px;overflow:auto;padding:12px 0 18px}button{border:1px solid #d5dfcb;border-radius:12px;background:#e6efdd;padding:10px 12px;color:#345447;white-space:nowrap;font:inherit;cursor:pointer}button.active{background:#54896d;color:white}.card{background:#fffef9ed;border:1px solid #e8dfc9;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 0 #e9e1d1}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid #d8e3d5;border-radius:11px;padding:11px;font:inherit;background:#fff}textarea{min-height:110px}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #e2e4d8}.item label{flex:1}.item input{width:20px;height:20px;accent-color:#478d72}.muted{font-size:12px;color:#7b9285}.hide{display:none}.pill{background:#f0f4eb;border-radius:12px;padding:10px;margin:6px 0}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}footer{text-align:center;color:#718273;font-size:12px;padding:20px}.song-group{margin:10px 0;border:1px solid #d9e5d5;border-radius:14px;background:#fffef9;overflow:hidden}.song-group summary{list-style:none;display:flex;align-items:center;gap:9px;padding:15px 12px;cursor:pointer;background:#f0f5e9;font-weight:700}.song-group summary::-webkit-details-marker{display:none}.song-group summary:after{content:'⌄';margin-left:auto;font-size:20px;transition:transform .2s}.song-group[open] summary:after{transform:rotate(180deg)}.song-group .group-items{padding:4px 13px 12px}.song-group .count{font-size:12px;color:#6a8370;background:white;border-radius:15px;padding:4px 9px;margin-left:auto}.song-group summary:after{margin-left:0}.progress{height:9px;background:#e5e9da;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#82ad86}.song-tools{display:flex;gap:8px;align-items:center;margin:12px 0}.song-tools input{flex:1;min-width:0}.song-tools button{flex:0 0 auto}.notebook-sticker{font-size:13px;background:#fff0cf;border:1px solid #f1d9a7;border-radius:10px;padding:8px 10px;margin-top:8px}@media(max-width:480px){header{margin:8px 8px 0;padding-left:40px}main{margin:0 8px 18px;padding:10px 10px 24px 35px}header:before,main:before{left:13px}.card{padding:12px}header h1{font-size:23px}nav button{font-size:13px;padding:9px}}
</style></head><body><header><h1>🌳 나의 동숲 기록장 <span style='font-size:12px'>v3</span></h1><small>놀러오세요 동물의 숲 · 나만의 수집 & 플레이 노트</small></header><main><nav id="tabs"></nav><section id="content"></section></main><footer>이 기기의 브라우저에 자동 저장돼요 · 백업 파일을 보관해 주세요</footer><script>
const tabs=['🎵 T.K. 음반','🪑 가구·아이템','🌷 꽃','🍎 과일','🐟 수집','📔 일지','⚙️ 백업'];let tab=0;let catalogQuery='';
const songs=`T.K.발라드|발라드,T.K.보사노바|보사노바,T.K.블루스|블루스,T.K.에튀드|클래식,T.K.왈츠|왈츠,T.K.자장가|자장가,T.K.재즈|재즈,T.K.스윙|스윙,T.K.찬송가|성가,T.K.러브송|발라드,T.K.마리아|클래식,T.K.파리|카페,T.K.퓨전|재즈,래그타임|래그타임,딕시랜드 재즈|재즈,온리미|팝,사랑해|팝,이틀 전|팝,T.K.로큰롤|록,T.K.메탈|메탈,T.K.빌리|로커빌리,T.K.펑키|펑크,T.K.형사|펑크,T.K.솔|소울,T.K.레게|레게,T.K.스카|스카,T.K.축제|댄스,T.K.퍼레이드|행진,T.K.매치|행진,T.K.의노래|팝,가자!T.K.라이더|팝,드럼앤베이스|전자음악,유로비트|전자음악,일렉트릭 뮤직|전자음악,테크노 비트|테크노,팝T.K.|팝,추억의T.K. 가요|가요,T.K.선생님|팝,T.K.가스펠|가스펠,T.K.딕시|컨트리,T.K.컨트리|컨트리,T.K.살사|살사,T.K.삼바|삼바,T.K.맘보|맘보,T.K.칼립소|칼립소,T.K.가믈란|월드,T.K.아프리카|월드,T.K.왕조|월드,T.K.웨스턴|웨스턴,T.K.차이나|월드,T.K.트롯트|트로트,T.K.민요|민요,T.K.탱고|탱고,까자크의 노래|월드,세뇨르T.K.|월드,아일랜드의 노래|월드,알로하T.K.|월드,알프스의 노래|월드,터키의 노래|월드,페루의 노래|월드,혼저옵서예T.K.|월드,뱃노래2001|민속,토마토 스파케티|월드,무서운 노래|분위기,오르막길|발라드,생각 중|몽환,숲 속 생활|어쿠스틱,내가 있는 곳|어쿠스틱,파도소리|서프 록`.split(',').map(x=>x.split('|'));
const songCategories=[{title:'☕ 재즈 · 클래식 · 편안한 음악',emoji:'☕',start:0,end:18},{title:'🎸 록 · 팝 · 댄스 · 전자음악',emoji:'🎸',start:18,end:45},{title:'🌏 세계 민속음악 · 이국적인 음악',emoji:'🌏',start:45,end:64},{title:'🌙 특별한 분위기 · 감성 음악',emoji:'🌙',start:64,end:70}];
let songQuery='';let songOpen={};
function songSection(){const q=songQuery.trim().toLowerCase();let count=songs.filter(s=>checked('song',s[0])).length;return `<div class="card"><h2>🎵 T.K. 음반 ${count}/${songs.length}</h2><div class="progress"><div style="width:${count/songs.length*100}%"></div></div><p class="notebook-sticker">📒 장르별 제목을 누르면 노래 목록이 펼쳐져요! 체크하면 수집 기록이 저장돼요.</p><div class="song-tools"><input id="search" placeholder="🔎 곡명 또는 장르 검색" value="${safe(songQuery)}" oninput="songQuery=this.value;drawSongGroups()"><button onclick="songQuery='';render()">지우기</button></div><div id="songlist">${songGroupsHTML(q)}</div><p class="muted">장르는 분위기별 참고 분류예요. 신청 전 게임 내 곡명 표기를 확인해 주세요.</p></div>`}
function songGroupsHTML(q){return songCategories.map((g,i)=>{const items=songs.slice(g.start,g.end);const matched=items.filter(s=>!q||s.join(' ').toLowerCase().includes(q)||g.title.toLowerCase().includes(q));if(!matched.length)return '';const done=items.filter(s=>checked('song',s[0])).length;const opened=q?true:!!songOpen[i];return `<details class="song-group" data-group="${i}" ${opened?'open':''} ontoggle="if(!songQuery) songOpen[${i}]=this.open"><summary><span>${g.title}</span><span class="count">${done}/${items.length}</span></summary><div class="group-items">${checklist('song',matched)}</div></details>`}).join('')||'<p class="muted">검색 결과가 없어요.</p>'}
function drawSongGroups(){const el=$('songlist');if(el)el.innerHTML=songGroupsHTML(songQuery.trim().toLowerCase())}
let data;try{data=JSON.parse(localStorage.getItem('acWildWorldLog')||'{}')}catch{data={}};data.checks??={};data.notes??={};data.journal??=[];data.catalog??=[];function save(){localStorage.setItem('acWildWorldLog',JSON.stringify(data))}const $=x=>document.getElementById(x);function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function checked(group,name){return !!data.checks[group+':'+name]}function toggle(group,name,val){data.checks[group+':'+name]=val;save();if(group==='song'){document.querySelectorAll('.song-group').forEach(el=>songOpen[el.dataset.group]=el.open)}render()}function checklist(group,items){return items.map(([name,genre])=>`<div class="item"><input type="checkbox" ${checked(group,name)?'checked':''} onchange="toggle('${group}',${JSON.stringify(name).replace(/"/g,'&quot;')},this.checked)"><label>${safe(name)}<div class="muted">${safe(genre||'')}</div></label>${group==='song'?`<button onclick="navigator.clipboard?.writeText(${JSON.stringify(name).replace(/"/g,'&quot;')})">복사</button>`:''}</div>`).join('')}
const catalogSeed={
'가구 · 생활':[ ['침대','가구'],['의자','가구'],['테이블','가구'],['소파','가구'],['수납장','가구'],['조명','가구'],['시계','가구'],['악기','가구'],['식물 가구','가구'] ],
'실내 장식':[ ['벽지','벽지'],['바닥','바닥'],['러그·기타','장식'] ],
'의상 · 액세서리':[ ['옷','의상'],['모자','모자'],['안경·액세서리','액세서리'],['우산','우산'] ],
'생활용품':[ ['도구','도구'],['편지지','편지지'],['토용','기타'] ]};
// These are navigation categories, not a verified exhaustive Wild World item database.
function catalogItems(){return [...(data.catalog||[])].filter(x=>x&&x.name)}
function catalogSection(){const items=catalogItems(),n=items.filter(x=>checked('catalog',x.name)).length;return `<div class="card"><h2>🪑 가구와 아이템 도감</h2><p class="notebook-sticker">📒 색인 탭을 열어 아이템을 체크해요. 원하는 아이템은 직접 추가하거나 CSV로 한꺼번에 가져올 수 있어요.</p><p class="muted">현재는 전체 공식 목록이 수록된 상태가 아니에요. 정확한 DS판 아이템 목록을 확인해 순차적으로 채울 수 있도록 만든 구조예요.</p><h3>수집 ${n} / ${items.length}</h3><div class="progress"><div style="width:${items.length?n/items.length*100:0}%"></div></div><input placeholder="🔎 아이템 이름 · 종류 검색" value="${safe(catalogQuery)}" oninput="catalogQuery=this.value;drawCatalog()"><div id="catalogList">${catalogHTML()}</div><h3>✏️ 아이템 직접 추가</h3><div class="row"><select id="catGroup">${Object.keys(catalogSeed).map(x=>`<option>${safe(x)}</option>`).join('')}</select><input id="catName" placeholder="아이템 이름"><button onclick="addCatalog()">추가</button></div><p class="muted">CSV 파일은 '이름,카테고리,종류' 열을 사용해요. 중복 이름은 건너뛰어요.</p><input type="file" accept=".csv,text/csv" onchange="importCatalog(this.files[0])"><button onclick="exportCatalog()">아이템 목록 CSV 내보내기</button></div>`}
function catalogHTML(){let q=catalogQuery.trim().toLowerCase(),items=catalogItems();return Object.keys(catalogSeed).map((g,i)=>{let all=items.filter(x=>x.group===g),filtered=all.filter(x=>!q||(x.name+' '+x.kind+' '+g).toLowerCase().includes(q));if(q&&!filtered.length)return '';let done=all.filter(x=>checked('catalog',x.name)).length;return `<details class="song-group" ${q?'open':''}><summary><span>${['🪑','🏠','👗','🧰'][i]} ${g}</span><span class="count">${done}/${all.length}</span></summary><div class="group-items">${filtered.length?filtered.map(x=>`<div class="item"><input type="checkbox" ${checked('catalog',x.name)?'checked':''} onchange="toggle('catalog',${JSON.stringify(x.name).replace(/"/g,'&quot;')},this.checked)"><label>${safe(x.name)}<div class="muted">${safe(x.kind||'아이템')}</div></label><button onclick="editCatalog(${JSON.stringify(x.name).replace(/"/g,'&quot;')})">메모</button></div>${data.notes['item:'+x.name]?`<p class="muted">📝 ${safe(data.notes['item:'+x.name])}</p>`:''}`).join(''):'<p class="muted">아직 등록한 아이템이 없어요.</p>'}</div></details>`}).join('')}
function drawCatalog(){document.getElementById('catalogList').innerHTML=catalogHTML()}
function addCatalog(){let name=$('catName').value.trim(),group=$('catGroup').value;if(!name)return;data.catalog??=[];if(data.catalog.some(x=>x.name===name)){alert('이미 등록한 이름이에요.');return}data.catalog.push({name,group,kind:'가구·아이템'});save();render()}
function editCatalog(name){let value=prompt(name+' 메모',data.notes['item:'+name]||'');if(value!==null){data.notes['item:'+name]=value;save();render()}}
async function importCatalog(file){if(!file)return;let raw=await file.text(),lines=raw.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean);function csvLine(s){return [...s.matchAll(/(?:^|,)(?:"((?:[^"]|"")*)"|([^,]*))/g)].map(m=>(m[1]??m[2]).replace(/""/g,'"').trim())}let rows=lines.map(csvLine);if(rows[0]?.[0]==='이름')rows.shift();data.catalog??=[];let added=0;for(let [name,group,kind] of rows){if(!name||data.catalog.some(x=>x.name===name))continue;data.catalog.push({name,group:Object.hasOwn(catalogSeed,group)?group:'가구 · 생활',kind:kind||'아이템'});added++}save();render();alert(added+'개 항목을 추가했어요.')}
function exportCatalog(){let rows=[['이름','카테고리','종류'],...catalogItems().map(x=>[x.name,x.group,x.kind])],csv=rows.map(row=>row.map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='동숲-아이템목록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function render(){ $('tabs').innerHTML=tabs.map((t,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()">${t}</button>`).join('');let c='';if(tab===0){c=songSection()}if(tab===1){c=catalogSection()}if(tab===2){c=`<div class="card"><h2>🌷 꽃 수집</h2><p class="muted">색상별로 체크하고 나만의 교배 기록을 남겨요.</p>${checklist('flower',['장미','튤립','코스모스','팬지'].flatMap(f=>['빨강','노랑','하양','분홍','주황','보라','검정','파랑'].map(color=>[f+' · '+color,'꽃 색상 기록'])))}</div>`}if(tab===3){c=`<div class="card"><h2>🍎 과일 수집</h2>${checklist('fruit',['사과','배','복숭아','체리','오렌지','야자'].map(x=>[x,'마을에 심기 / 보유 확인']))}</div><div class="card"><h3>🌳 나무 심기 메모</h3><p>건물·절벽·다른 나무와의 간격을 확인하고, 심은 뒤 며칠간 성장 상태를 살펴보세요.</p></div>`}if(tab===4){c=`<div class="card"><h2>🐟 나만의 수집 목록</h2><p class="muted">곤충·물고기·화석 이름을 직접 추가하고 체크해요.</p><div class="row"><select id="kind"><option>물고기</option><option>곤충</option><option>화석</option><option>기타</option></select><input id="newitem" placeholder="이름"><button onclick="addItem()">추가</button></div>${(data.custom||[]).map((x,i)=>`<div class="item"><input type="checkbox" ${x.done?'checked':''} onchange="data.custom[${i}].done=this.checked;save()"><label>${safe(x.kind)} · ${safe(x.name)}</label><button onclick="data.custom.splice(${i},1);save();render()">삭제</button></div>`).join('')}</div>`}if(tab===5){c=`<div class="card"><h2>📔 플레이 일지</h2><input type="date" id="day" value="${new Date().toLocaleDateString('sv-SE')}"><textarea id="entry" placeholder="오늘 한 일, 주민과의 대화, 다음에 할 일…"></textarea><button onclick="addEntry()">일지 저장</button></div>${data.journal.map((x,i)=>`<div class="card"><b>${safe(x.date)}</b><p style="white-space:pre-wrap">${safe(x.text)}</p><button onclick="data.journal.splice(${i},1);save();render()">삭제</button></div>`).join('')}`}if(tab===6){c=`<div class="card"><h2>⚙️ 백업과 복원</h2><p>기록은 현재 브라우저에 저장돼요. 다른 기기로 옮기려면 백업 파일을 내려받아 복원하세요.</p><button onclick="backup()">JSON 백업 다운로드</button><p><input type="file" accept="application/json" onchange="restore(this.files[0])"></p></div>`}c+=tab===2||tab===3?`<div class="card"><h3>📝 내 메모</h3><textarea id="memo" oninput="data.notes['${tab}']=this.value;save()" placeholder="발견 장소, 교배 계획, 심은 위치…">${safe(data.notes[tab]||'')}</textarea></div>`:'';$('content').innerHTML=c}function addItem(){let n=$('newitem').value.trim();if(!n)return;data.custom??=[];data.custom.push({kind:$('kind').value,name:n,done:false});save();render()}function addEntry(){let t=$('entry').value.trim();if(!t)return;data.journal.unshift({date:$('day').value,text:t});save();render()}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='동숲기록장-백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(file){if(!file)return;try{let v=JSON.parse(await file.text());if(!v||typeof v!=='object'||!confirm('현재 기록을 백업 파일로 교체할까요?'))return;data={checks:v.checks||{},notes:v.notes||{},journal:v.journal||[],custom:v.custom||[],catalog:v.catalog||[]};save();render()}catch{alert('올바른 백업 파일이 아니에요.')}}render();</script></body></html>
