<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d7edcf"><title>나의 동숲 기록장</title><style>body{margin:0;background:#f5f4e9;color:#355447;font-family:system-ui,-apple-system,sans-serif}header{background:#d7edcf;padding:25px 20px;border-radius:0 0 24px 24px}h1{margin:0;font-size:25px}small{color:#648070}main{max-width:760px;margin:auto;padding:16px}nav{display:flex;gap:7px;overflow:auto;padding:10px 0}button{border:0;border-radius:14px;background:#e1e9d9;padding:11px 14px;color:#345447;white-space:nowrap}button.active{background:#478d72;color:white}.card{background:white;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 2px 9px #315b4510}input,textarea,select{box-sizing:border-box;width:100%;border:1px solid #d8e3d5;border-radius:12px;padding:12px;font:inherit;background:#fff}textarea{min-height:110px}.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf1e9}.item label{flex:1}.item input{width:20px;height:20px;accent-color:#478d72}.muted{font-size:12px;color:#7b9285}.hide{display:none}.pill{background:#f0f4eb;border-radius:12px;padding:10px;margin:6px 0} .row{display:flex;gap:8px;align-items:center}.row>*{flex:1}footer{text-align:center;color:#8a9a8c;font-size:12px;padding:30px}</style></head><body><header><h1>🌳 나의 동숲 기록장</h1><small>놀러오세요 동물의 숲 · 나만의 수집 & 플레이 노트</small></header><main><nav id="tabs"></nav><section id="content"></section></main><footer>이 기기의 브라우저에 자동 저장돼요 · 백업 파일을 보관해 주세요</footer><script>
const tabs=['🎵 T.K. 음반','🌷 꽃','🍎 과일','🐟 수집','📔 일지','⚙️ 백업'];let tab=0;
const songs=`T.K.발라드|발라드,T.K.보사노바|보사노바,T.K.블루스|블루스,T.K.에튀드|클래식,T.K.왈츠|왈츠,T.K.자장가|자장가,T.K.재즈|재즈,T.K.스윙|스윙,T.K.찬송가|성가,T.K.러브송|발라드,T.K.마리아|클래식,T.K.파리|카페,T.K.퓨전|재즈,래그타임|래그타임,딕시랜드 재즈|재즈,온리미|팝,사랑해|팝,이틀 전|팝,T.K.로큰롤|록,T.K.메탈|메탈,T.K.빌리|로커빌리,T.K.펑키|펑크,T.K.형사|펑크,T.K.솔|소울,T.K.레게|레게,T.K.스카|스카,T.K.축제|댄스,T.K.퍼레이드|행진,T.K.매치|행진,T.K.의노래|팝,가자!T.K.라이더|팝,드럼앤베이스|전자음악,유로비트|전자음악,일렉트릭 뮤직|전자음악,테크노 비트|테크노,팝T.K.|팝,추억의T.K. 가요|가요,T.K.선생님|팝,T.K.가스펠|가스펠,T.K.딕시|컨트리,T.K.컨트리|컨트리,T.K.살사|살사,T.K.삼바|삼바,T.K.맘보|맘보,T.K.칼립소|칼립소,T.K.가믈란|월드,T.K.아프리카|월드,T.K.왕조|월드,T.K.웨스턴|웨스턴,T.K.차이나|월드,T.K.트롯트|트로트,T.K.민요|민요,T.K.탱고|탱고,까자크의 노래|월드,세뇨르T.K.|월드,아일랜드의 노래|월드,알로하T.K.|월드,알프스의 노래|월드,터키의 노래|월드,페루의 노래|월드,혼저옵서예T.K.|월드,뱃노래2001|민속,토마토 스파케티|월드,무서운 노래|분위기,오르막길|발라드,생각 중|몽환,숲 속 생활|어쿠스틱,내가 있는 곳|어쿠스틱,파도소리|서프 록`.split(',').map(x=>x.split('|'));
let data;try{data=JSON.parse(localStorage.getItem('acWildWorldLog')||'{}')}catch{data={}};data.checks??={};data.notes??={};data.journal??=[];function save(){localStorage.setItem('acWildWorldLog',JSON.stringify(data))}const $=x=>document.getElementById(x);function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function checked(group,name){return !!data.checks[group+':'+name]}function toggle(group,name,val){data.checks[group+':'+name]=val;save();render()}function checklist(group,items){return items.map(([name,genre])=>`<div class="item"><input type="checkbox" ${checked(group,name)?'checked':''} onchange="toggle('${group}',${JSON.stringify(name).replace(/"/g,'&quot;')},this.checked)"><label>${safe(name)}<div class="muted">${safe(genre||'')}</div></label>${group==='song'?`<button onclick="navigator.clipboard?.writeText(${JSON.stringify(name).replace(/"/g,'&quot;')})">복사</button>`:''}</div>`).join('')}
function render(){ $('tabs').innerHTML=tabs.map((t,i)=>`<button class="${tab===i?'active':''}" onclick="tab=${i};render()">${t}</button>`).join('');let c='';if(tab===0){let count=songs.filter(s=>checked('song',s[0])).length;c=`<div class="card"><h2>🎵 T.K. 음반 ${count}/${songs.length}</h2><p class="muted">한국어 곡명과 장르는 참고용이며 신청 전 게임 내 표기를 확인해 주세요.</p><input id="search" placeholder="곡명 또는 장르 검색" oninput="filterSongs()"><div id="songlist">${checklist('song',songs)}</div></div>`}if(tab===1){c=`<div class="card"><h2>🌷 꽃 수집</h2><p class="muted">색상별로 체크하고 나만의 교배 기록을 남겨요.</p>${checklist('flower',['장미','튤립','코스모스','팬지'].flatMap(f=>['빨강','노랑','하양','분홍','주황','보라','검정','파랑'].map(color=>[f+' · '+color,'꽃 색상 기록'])))}</div>`}if(tab===2){c=`<div class="card"><h2>🍎 과일 수집</h2>${checklist('fruit',['사과','배','복숭아','체리','오렌지','야자'].map(x=>[x,'마을에 심기 / 보유 확인']))}</div><div class="card"><h3>🌳 나무 심기 메모</h3><p>건물·절벽·다른 나무와의 간격을 확인하고, 심은 뒤 며칠간 성장 상태를 살펴보세요.</p></div>`}if(tab===3){c=`<div class="card"><h2>🐟 나만의 수집 목록</h2><p class="muted">곤충·물고기·화석 이름을 직접 추가하고 체크해요.</p><div class="row"><select id="kind"><option>물고기</option><option>곤충</option><option>화석</option><option>기타</option></select><input id="newitem" placeholder="이름"><button onclick="addItem()">추가</button></div>${(data.custom||[]).map((x,i)=>`<div class="item"><input type="checkbox" ${x.done?'checked':''} onchange="data.custom[${i}].done=this.checked;save()"><label>${safe(x.kind)} · ${safe(x.name)}</label><button onclick="data.custom.splice(${i},1);save();render()">삭제</button></div>`).join('')}</div>`}if(tab===4){c=`<div class="card"><h2>📔 플레이 일지</h2><input type="date" id="day" value="${new Date().toLocaleDateString('sv-SE')}"><textarea id="entry" placeholder="오늘 한 일, 주민과의 대화, 다음에 할 일…"></textarea><button onclick="addEntry()">일지 저장</button></div>${data.journal.map((x,i)=>`<div class="card"><b>${safe(x.date)}</b><p style="white-space:pre-wrap">${safe(x.text)}</p><button onclick="data.journal.splice(${i},1);save();render()">삭제</button></div>`).join('')}`}if(tab===5){c=`<div class="card"><h2>⚙️ 백업과 복원</h2><p>기록은 현재 브라우저에 저장돼요. 다른 기기로 옮기려면 백업 파일을 내려받아 복원하세요.</p><button onclick="backup()">JSON 백업 다운로드</button><p><input type="file" accept="application/json" onchange="restore(this.files[0])"></p></div>`}c+=tab===1||tab===2?`<div class="card"><h3>📝 내 메모</h3><textarea id="memo" oninput="data.notes['${tab}']=this.value;save()" placeholder="발견 장소, 교배 계획, 심은 위치…">${safe(data.notes[tab]||'')}</textarea></div>`:'';$('content').innerHTML=c}function filterSongs(){let q=$('search').value.trim().toLowerCase();$('songlist').innerHTML=checklist('song',songs.filter(s=>s.join(' ').toLowerCase().includes(q)))}function addItem(){let n=$('newitem').value.trim();if(!n)return;data.custom??=[];data.custom.push({kind:$('kind').value,name:n,done:false});save();render()}function addEntry(){let t=$('entry').value.trim();if(!t)return;data.journal.unshift({date:$('day').value,text:t});save();render()}function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='동숲기록장-백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(file){if(!file)return;try{let v=JSON.parse(await file.text());if(!v||typeof v!=='object'||!confirm('현재 기록을 백업 파일로 교체할까요?'))return;data={checks:v.checks||{},notes:v.notes||{},journal:v.journal||[],custom:v.custom||[]};save();render()}catch{alert('올바른 백업 파일이 아니에요.')}}render();</script></body></html>
