</style></head><body><div class="book"><header class="cover"><h1>🌳 나의 동숲 기록장 <small>v4.0</small></h1><small>놀러오세요 동물의 숲 · 수집 백과사전 & 플레이 노트 📒</small></header><main class="page"><nav class="tabs" id="tabs"></nav><div id="view"></div></main></div><div class="footer">💚 기록은 이 브라우저에 저장돼요 · 다른 기기로 옮길 땐 JSON 백업을 이용해 주세요.</div><script src="catalog.js"></script><script>

let data;try{data=JSON.parse(localStorage.getItem('acWildWorldLog')||'{}')}catch{data={}};data.checks??={};data.notes??={};data.journal??=[];data.catalog??=[];data.hra??={score:0,history:[],placed:{}};data.tier??='normal';data.donated??={};let tab=0,catQuery='',catType='전체',catGroup='전체',rareQuery='',rareType='전체',songQuery='',flowerType='장미';
const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>Number(n).toLocaleString('ko-KR');const key=(type,name)=>type+':'+name;const has=(type,name)=>!!data.checks[key(type,name)];function save(){try{localStorage.setItem('acWildWorldLog',JSON.stringify(data))}catch(e){alert('저장 공간이 부족해요. JSON 백업을 받아 주세요.')}}function setCheck(type,name,value){data.checks[key(type,name)]=value;save();renderView()}function setDonated(name,v){data.donated[name]=v;save();renderView()}function pct(a,b){return b?Math.round(a/b*100):0}function prog(a,b){return `<div class="progress"><span style="width:${pct(a,b)}%"></span></div>`}function norm(s){return String(s).toLowerCase().replace(/[\s.·]/g,'').replace('컬러풀','칼라풀')}function isFound(item,q){return !q||norm(item.name+' '+item.group+' '+item.category).includes(norm(q))}function catalogItems(){return [...CATALOG,...(data.catalog||[]).map((x,i)=>({id:'user:'+i,name:x.name,category:x.kind||'가구',group:x.group||'직접 추가',price:x.price??null}))]}function done(item){return has('catalog',item.id)||has('catalog',item.name)||has('catalog',item.name.replace(/^.+? /,''))&&item.group==='직접 추가'}function toggleItem(id,v){data.checks['catalog:'+id]=v;save();renderView()}function price(p){if(p===null||p===undefined)return '<span class="price">🎁 비매품</span>';let rate={normal:0,silver:.05,gold:.1}[data.tier]||0,now=Math.floor(p*(1-rate)+.5);return `<span class="price">${num(now)}벨${rate?`<br><del>${num(p)}벨</del>`:''}</span>`}
function nav(){ $('tabs').innerHTML=TABS.map((t,i)=>`<button class="tab ${tab===i?'active':''}" onclick="tab=${i};render()">${t}</button>`).join('') }function render(){nav();renderView()};function renderView(){let html='';switch(tab){case 0:html=home();break;case 1:html=catalogPage(false);break;case 2:html=catalogPage(true);break;case 3:html=songPage();break;case 4:html=flowerPage();break;case 5:html=fruitPage();break;case 6:html=fossilPage();break;case 7:html=hraPage();break;case 8:html=journalPage();break;case 9:html=backupPage();break} $('view').innerHTML=html}
function home(){let items=catalogItems(),d=items.filter(done).length;return `<div class="card"><h2>🌼 오늘도 즐거운 마을 생활!</h2><p class="tip">📒 노트 색인 탭을 눌러 도감을 펼쳐봐요. 수집한 물건은 체크하고, 비매품은 획득 방법을 살펴볼 수 있어요.</p><h3>🪑 카탈로그 ${num(d)} / ${num(items.length)}</h3>${prog(d,items.length)}<p class="muted">한국어판 원문 카탈로그 1,348개 수록 · 직접 추가 항목은 별도</p><div class="chips"><button class="pill" onclick="tab=1;render()">🛍️ 가구 찾기</button><button class="pill" onclick="tab=2;render()">🎁 비매품 모아보기</button><button class="pill" onclick="tab=7;render()">🏠 해피룸 점수</button></div></div><div class="card"><h3>🌷 나의 수집 현황</h3>${[['🎵 음반',songs.filter(s=>has('song',s[0])).length,songs.length,3],['🍎 과일',FRUITS.filter(x=>has('fruit',x[0])).length,6,5],['🦴 화석',CATALOG.filter(x=>x.category==='화석'&&done(x)).length,52,6]].map(x=>`<div class="hrapair"><span>${x[0]} ${x[1]}/${x[2]}</span><button class="btn small" onclick="tab=${x[3]};render()">열기</button></div>${prog(x[1],x[2])}`).join('')}</div>`}
function tierControls(){return `<div class="chips"><span class="muted" style="align-self:center">너굴 회원 등급</span>${[['normal','일반 0%'],['silver','실버 5%'],['gold','골드 10%']].map(x=>`<button class="pill ${data.tier===x[0]?'active':''}" onclick="data.tier='${x[0]}';save();renderView()">${x[1]}</button>`).join('')}</div>`}
function catRow(it){return `<div class="item"><input aria-label="${esc(it.name)} 수집" type="checkbox" ${done(it)?'checked':''} onchange="toggleItem(${JSON.stringify(it.id).replace(/"/g,'&quot;')},this.checked)"><div class="name"><b>${esc(it.name)}</b><div class="sub">${esc(it.group)} · ${esc(it.category)}</div></div>${price(it.price)}<button class="btn small" onclick="editMemo(${JSON.stringify(it.id).replace(/"/g,'&quot;')})">📝</button></div>${data.notes['item:'+it.id]?`<p class="muted">✏️ ${esc(data.notes['item:'+it.id])}</p>`:''}`}
function catList(arr,groupBy){if(!arr.length)return '<p class="empty">검색 결과가 없어요.</p>';let groups={};for(let it of arr){let k=groupBy(it);(groups[k]??=[]).push(it)}return Object.entries(groups).map(([g,a])=>`<details class="group" ${catQuery||rareQuery?'open':''}><summary>${esc(g)} <span class="count">${a.filter(done).length}/${a.length}</span></summary><div class="groupbody">${a.map(catRow).join('')}</div></details>`).join('')}
function catalogPage(rare){let items=catalogItems().filter(x=>!rare||x.price===null);let q=rare?rareQuery:catQuery;let type=rare?rareType:catType;let filtered=items.filter(x=>(type==='전체'||x.category===type)&&(!(!rare&&catGroup!=='전체')||x.group===catGroup)&&isFound(x,q));let types=['전체',...new Set(items.map(x=>x.category))];let groups=['전체',...new Set(items.filter(x=>catType==='전체'||x.category===catType).map(x=>x.group))];let n=items.filter(done).length;return `<div class="card"><h2>${rare?'🎁 비매품 전용 도감':'🪑 한국어판 카탈로그'}</h2><p class="muted">${rare?'카탈로그에 비매품으로 표시된 항목만 모았어요.':'사용자가 제공한 한국어판 1,348개 목록과 주문 가격을 수록했어요.'}</p><b>${num(n)} / ${num(items.length)} 수집</b>${prog(n,items.length)}${rare?'<p class="tip">비매품은 주문 가격이 없어요. 일부 아이템은 아래 획득 힌트에서 확인할 수 있어요.</p>':tierControls()}<div class="tools"><input type="search" id="catsearch" value="${esc(q)}" placeholder="🔎 이름·시리즈 검색" oninput="${rare?'rareQuery':'catQuery'}=this.value;refreshList()"><select onchange="${rare?'rareType':'catType'}=this.value;${rare?'':'catGroup=\'전체\';'}renderView()">${types.map(x=>`<option ${x===type?'selected':''}>${esc(x)}</option>`).join('')}</select>${rare?'':`<select onchange="catGroup=this.value;renderView()">${groups.map(x=>`<option ${x===catGroup?'selected':''}>${esc(x)}</option>`).join('')}</select>`}</div><div id="catlist">${catList(filtered,x=>rare?x.category+' · '+x.group:x.group)}</div></div>${rare?rareHints():seriesReference()+`<div class="card"><h3>➕ 나만의 아이템 추가</h3><div class="tools"><input id="newName" placeholder="아이템 이름"><select id="newKind">${['가구','옷','벽지','바닥','기타'].map(x=>`<option>${x}</option>`).join('')}</select><button class="btn" onclick="addCustom()">추가</button></div></div>`}`}
function refreshList(){let items=catalogItems().filter(x=>(tab!==2||x.price===null)&&((tab===2?rareType:catType)==='전체'||x.category===(tab===2?rareType:catType))&&(tab===2||catGroup==='전체'||x.group===catGroup)&&isFound(x,tab===2?rareQuery:catQuery));$('catlist').innerHTML=catList(items,x=>tab===2?x.category+' · '+x.group:x.group)}
function editMemo(id){let v=prompt('아이템 메모',data.notes['item:'+id]||'');if(v!==null){data.notes['item:'+id]=v;save();renderView()}}function addCustom(){let name=$('newName').value.trim();if(!name)return;data.catalog.push({name,kind:$('newKind').value,group:'직접 추가'});save();renderView()}
function seriesReference(){return `<div class="card"><h3>🖼️ 가구 시리즈 그림 참고</h3><p class="muted">시리즈를 선택해 목록을 찾고, 원본 참고 그림을 확인할 수 있어요. 외부 블로그 이미지는 직접 표시가 차단될 수 있어 원문 링크로 연결했어요.</p><div class="chips">${series.map(s=>`<button class="pill ${catGroup===s?'active':''}" onclick="catType='가구';catGroup='${s}';catQuery='';renderView()">${s}</button>`).join('')}</div><a class="ref" href="https://qubell.tistory.com/entry/놀동숲-가구-시리즈" target="_blank" rel="noopener noreferrer">📸 시리즈별 원본 가구 그림 보기 (티스토리) ↗</a></div>`}
function rareHints(){return `<div class="card"><h3>🎀 비매품 획득 힌트</h3>${[['⛄ 눈사람 세트','눈사람을 잘 만들면 보상으로 받을 수 있어요.'],['🍄 버섯 세트','도토리 축제 관련 보상이에요.'],['🏝️ 해탈한·사하라','특별 방문객을 통해 벽지·바닥을 획득해요.'],['🚀 죠니','UFO 방문객의 특별 기념품이에요.'],['👗 그레이스','패션 관련 특별 의상을 얻을 수 있어요.'],['🏆 트로피·집 모형','대회·해피룸 아카데미 목표를 달성해요.']].map(x=>`<details class="group"><summary>${x[0]}</summary><div class="groupbody">${x[1]}</div></details>`).join('')}<p class="muted">일부 획득 조건은 사용자가 제공한 블로그 캡처를 참고했으며, 아이템별 세부 조건은 별도 확인이 필요해요.</p></div>`}
function songPage(){let groups={};for(let [name,genre] of songs)(groups[genre]??=[]).push(name);let total=songs.filter(x=>has('song',x[0])).length;return `<div class="card"><h2>🎵 T.K. 음반 도감</h2><b>${total}/${songs.length}</b>${prog(total,songs.length)}<p class="tip">장르를 눌러 펼치고, 신청곡 이름을 복사해요.</p><input type="search" value="${esc(songQuery)}" placeholder="🔎 노래 또는 장르" oninput="songQuery=this.value;renderView()">${Object.entries(groups).map(([g,names])=>{let matched=names.filter(n=>norm(n+' '+g).includes(norm(songQuery)));return !matched.length?'':`<details class="group" ${songQuery?'open':''}><summary>🎶 ${esc(g)} <span class="count">${names.filter(n=>has('song',n)).length}/${names.length}</span></summary><div class="groupbody">${matched.map(n=>`<div class="item"><input type="checkbox" ${has('song',n)?'checked':''} onchange="setCheck('song',${JSON.stringify(n).replace(/"/g,'&quot;')},this.checked)"><div class="name">${esc(n)}</div><button class="btn small" onclick="copyText(${JSON.stringify(n).replace(/"/g,'&quot;')})">복사</button></div>`).join('')}</div></details>`}).join('')}<p class="muted">곡명과 장르는 이전 v3 목록을 이어받았어요. 일부 게임 내 표기는 추가 검증이 필요해요.</p></div>`}
function flowerPage(){let colors=FLOWERS[flowerType];return `<div class="card"><h2>🌷 꽃 도감 & 교배 노트</h2><div class="chips">${Object.keys(FLOWERS).map(f=>`<button class="pill ${flowerType===f?'active':''}" onclick="flowerType='${f}';renderView()">${f}</button>`).join('')}</div><div class="grid">${colors.map(c=>{let n=flowerType+' · '+c;return `<button class="tile ${has('flower',n)?'done':''}" onclick="setCheck('flower','${n}',!has('flower','${n}'))"><div class="flowerdot" style="--fc:${FC[c]}"><span class="flower">🌼</span></div><b>${c}</b><div class="muted">${has('flower',n)?'✓ 수집':'○ 미수집'}</div></button>`}).join('')}</div></div><div class="card"><h3>🧬 꽃 교배표</h3><p class="muted">업로드한 원본 교배표를 참고용으로 수록했어요. 교배 결과는 확률적이며 실제 게임 버전과 일치하는지 확인해 주세요.</p>${flowerType==='코스모스'||flowerType==='장미'?`<img class="chart" src="assets/flower_chart_1.png" alt="코스모스와 장미 교배표">`:flowerType==='튤립'?`<img class="chart" src="assets/flower_chart_2.png" alt="튤립 교배표">`:`<img class="chart" src="assets/flower_chart_3.png" alt="팬지 교배표">`}<textarea class="note" placeholder="교배 메모" oninput="data.notes['flower:'+flowerType]=this.value;save()">${esc(data.notes['flower:'+flowerType]||'')}</textarea></div>`}
function fruitPage(){return `<div class="card"><h2>🍎 과일 그림 도감</h2><p class="muted">그림을 누르면 수집 여부가 바뀌어요. 업로드한 과일 사진을 품목별로 잘라 사용했어요.</p><div class="grid">${FRUITS.map(([n,img])=>`<button class="tile ${has('fruit',n)?'done':''}" onclick="setCheck('fruit','${n}',!has('fruit','${n}'))"><img src="assets/${img}.webp" alt="${n}"><b>${n}</b><div class="muted">${has('fruit',n)?'✓ 수집':'○ 미수집'}</div></button>`).join('')}</div></div><div class="card"><h3>🌳 나무·과일 메모</h3><textarea class="note" oninput="data.notes.fruit=this.value;save()" placeholder="심은 장소나 교환 기록">${esc(data.notes.fruit||'')}</textarea></div>`}
function fossilPage(){let a=CATALOG.filter(x=>x.category==='화석');return `<div class="card"><h2>🦴 화석 도감</h2><p class="muted">보유와 박물관 기증을 따로 기록해요.</p><b>보유 ${a.filter(done).length}/52 · 기증 ${a.filter(x=>data.donated[x.id]).length}/52</b>${prog(a.filter(x=>data.donated[x.id]).length,52)}${a.map(x=>`<div class="item"><input type="checkbox" ${done(x)?'checked':''} onchange="toggleItem('${x.id}',this.checked)"><div class="name">${esc(x.name)}</div><label class="muted row"><input type="checkbox" ${data.donated[x.id]?'checked':''} onchange="setDonated('${x.id}',this.checked)">기증</label></div>`).join('')}</div>`}
function hraPage(){let score=Number(data.hra.score)||0,goals=[[70000,'집 모형'],[100000,'2층집 모형'],[150000,'저택 모형']];return `<div class="card"><h2>🏠 해피룸 아카데미</h2><p class="tip">매주 일요일 편지로 평가 결과를 받아요. 집 안 모든 방의 점수를 합산해요.</p><label>현재 점수<input type="number" min="0" value="${score}" oninput="data.hra.score=Math.max(0,Number(this.value)||0);save();updateHraGoals()"></label><div id="hraGoals">${hraGoals(score,goals)}</div><button class="btn" onclick="recordHra()">📌 이번 주 점수 기록</button>${data.hra.history.map((h,i)=>`<div class="hrapair"><span>${esc(h.date)} · ${num(h.score)}점 ${esc(h.note||'')}</span><button class="btn small" onclick="data.hra.history.splice(${i},1);save();renderView()">삭제</button></div>`).join('')}</div><div class="card"><h3>🛋️ 시리즈 완성도와 방 배치</h3><p class="muted">수집 체크는 카탈로그와 연동돼요. 실제 한 방에 배치했는지는 별도로 체크해 주세요.</p>${series.map(s=>{let a=CATALOG.filter(x=>x.category==='가구'&&x.group===s),wall=CATALOG.filter(x=>x.category==='벽지'&&x.name.includes(s==='아시아'?'아시아':s==='통나무'?'통나무':s));let floor=CATALOG.filter(x=>x.category==='바닥'&&x.name.includes(s==='아시아'?'아시아':s==='통나무'?'통나무':s));let n=a.filter(done).length;return `<details class="group"><summary>${s} <span class="count">가구 ${n}/${a.length}</span></summary><div class="groupbody">${prog(n,a.length)}<p class="muted">벽지 ${wall.some(done)?'✓':'○'} · 바닥 ${floor.some(done)?'✓':'○'}</p><label class="row"><input type="checkbox" ${data.hra.placed[s]?'checked':''} onchange="data.hra.placed['${s}']=this.checked;save()"> 같은 방에 배치 완료</label></div></details>`}).join('')}</div><div class="card"><h3>📖 점수 올리는 법</h3>${[['시리즈 가구','같은 방에 가구 10종을 모으면 +20,000점, 벽지 또는 바닥을 추가하면 +25,000점, 벽지와 바닥을 모두 갖추면 +30,000점 (단계별 총점, 중복 합산 아님).'],['테마와 세트','테마 벽지+바닥은 3,000점. 테마 완성 보너스는 3,000점 + 가구 수 × 3,000점, 세트 완성은 가구 수 × 1,000점으로 소개돼요.'],['행운 가구','서로 다른 행운 가구 종류당 +7,777점. 예: 돼지 저금통, 생일 케이크, 오르골.'],['기본 점수','예시: 주민 사진 3,200점, 작은 화석 300점, 토용 828점. 가구마다 점수가 달라요.'],['풍수 배치','서쪽 노랑 · 동쪽 빨강 · 남쪽 초록. 벽에서 두 칸 이내의 가구 색상을 고려해요.'],['감점 요소','가구의 앞면이 벽을 향하면 감점될 수 있고, 바닥에 놓은 비가구 물건도 감점 요인이에요.']].map(x=>`<details class="group"><summary>${x[0]}</summary><div class="groupbody">${x[1]}</div></details>`).join('')}<p class="muted">참고: 사용자가 제공한 해피룸 공략 자료와 이미지. 게임 내 점수 계산과 차이가 있을 수 있어요.</p><a class="ref" href="https://record72592.tistory.com/67" target="_blank" rel="noopener noreferrer">해피룸 아카데미 참고 글 ↗</a></div>`}
function hraGoals(score,goals){return goals.map(([n,title])=>`<div class="hrapair"><span>🏡 ${title} · ${num(n)}점</span><b>${score>=n?'달성!':num(n-score)+'점 남음'}</b></div><div class="bar"><span style="width:${Math.min(100,pct(score,n))}%"></span></div>`).join('')}function updateHraGoals(){$('hraGoals').innerHTML=hraGoals(Number(data.hra.score)||0,[[70000,'집 모형'],[100000,'2층집 모형'],[150000,'저택 모형']])}function recordHra(){let note=prompt('이번 주 배치 변경·메모 (선택)','');if(note===null)return;data.hra.history.unshift({date:new Date().toLocaleDateString('sv-SE'),score:Number(data.hra.score)||0,note});save();renderView()}
function journalPage(){return `<div class="card"><h2>📔 플레이 일지</h2><input type="date" id="day" value="${new Date().toLocaleDateString('sv-SE')}"><textarea id="entry" class="note" placeholder="오늘 한 일, 주민 이야기, 다음 할 일..."></textarea><button class="btn primary" onclick="addEntry()">일지 저장</button></div>${data.journal.map((x,i)=>`<div class="card"><b>${esc(x.date)}</b><p style="white-space:pre-wrap">${esc(x.text)}</p><button class="btn small" onclick="data.journal.splice(${i},1);save();renderView()">삭제</button></div>`).join('')}`};function addEntry(){let v=$('entry').value.trim();if(!v)return;data.journal.unshift({date:$('day').value,text:v});save();renderView()}
function backupPage(){return `<div class="card"><h2>⚙️ 백업 · 복원</h2><p>현재 기기의 브라우저에 자동 저장돼요. 아이폰과 아이패드의 기록은 자동 동기화되지 않아요.</p><button class="btn primary" onclick="backup()">⬇️ JSON 백업 다운로드</button><h3>기존 기록 복원</h3><input type="file" accept=".json,application/json" onchange="restore(this.files[0])"><p class="muted">복원하면 현재 기록을 교체해요. 먼저 백업해 두세요.</p><h3>카탈로그 목록 CSV</h3><button class="btn" onclick="exportCSV()">1,348개 목록 CSV 내보내기</button></div>`}
function download(name,text,mime){let url=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}function backup(){download('동숲기록장-v4-백업.json',JSON.stringify(data,null,2),'application/json')}async function restore(file){if(!file)return;try{let v=JSON.parse(await file.text());if(!v||typeof v!=='object'||!confirm('현재 기록을 백업 파일로 교체할까요?'))return;data={...v,checks:v.checks||{},notes:v.notes||{},journal:v.journal||[],catalog:v.catalog||[],hra:v.hra||{score:0,history:[],placed:{}},tier:v.tier||'normal',donated:v.donated||{}};data.hra.placed??={};data.hra.history??=[];save();render()}catch(e){alert('올바른 JSON 백업 파일인지 확인해 주세요.')}}function exportCSV(){let rows=[['이름','카테고리','시리즈·그룹','기본가격(벨)','비매품'],...CATALOG.map(x=>[x.name,x.category,x.group,x.price??'',x.price===null?'Y':'N'])];download('놀동숲-한국어판-카탈로그-1348.csv','\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function copyText(s){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>alert('곡명을 복사했어요.')).catch(()=>prompt('곡명을 복사하세요',s))}else prompt('곡명을 복사하세요',s)}render();
</script></body></html>
